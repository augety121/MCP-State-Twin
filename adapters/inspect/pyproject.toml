[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "statetwin-inspect"
version = "0.1.0a1"
description = "Tools-only State Twin sessions for Inspect AI (offline contract profile)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["inspect-ai==0.3.275", "mcp==1.26.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
