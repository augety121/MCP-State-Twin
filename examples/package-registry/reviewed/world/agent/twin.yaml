apiVersion: statetwin.dev/v1alpha1
kind: Twin

metadata:
  name: package-registry
  upstream:
    protocol: mcp
    status: unbound
  fidelity:
    level: L1
    status: unverified

clock:
  mode: virtual
  initial: "2026-08-01T00:00:00Z"

state:
  entities:
    package:
      key: [name]
    release:
      key: [package, version]
    advisory:
      key: [id]
    installation:
      key: [project, package]

invariants:
  - id: release-version-present
    assert: "state.entities.release.all(k, size(state.entities.release[k].version) > 0)"
  - id: yanked-is-boolean
    assert: "state.entities.release.all(k, state.entities.release[k].yanked == true || state.entities.release[k].yanked == false)"

tools:
  - name: get_package
    description: Get a simulated package by its canonical name.
    inputSchema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
    outputSchema:
      type: object
      additionalProperties: false
      required: [package]
      properties:
        package:
          type: object
          additionalProperties: false
          required: [name, description, defaultVersion]
          properties:
            name: {type: string, minLength: 1}
            description: {type: string}
            defaultVersion: {type: string, minLength: 1}
    query:
      entity: package
      key: input.name
      as: package
    result: "{'package': vars.package}"

  - name: list_releases
    description: List simulated package releases in stable key order.
    inputSchema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
    outputSchema:
      type: object
      additionalProperties: false
      required: [releases]
      properties:
        releases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [package, version, publishedAt, yanked]
            properties:
              package: {type: string, minLength: 1}
              version: {type: string, minLength: 1}
              publishedAt: {type: string, format: date-time}
              yanked: {type: boolean}
              yankedAt: {type: string, format: date-time}
    query:
      entity: release
      many: true
      where: item.package == input.name
      as: releases
    result: "{'releases': vars.releases}"

  - name: publish_release
    description: Publish a new release in the isolated simulated registry.
    inputSchema:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
    outputSchema:
      type: object
      additionalProperties: false
      required: [release]
      properties:
        release:
          type: object
          additionalProperties: false
          required: [package, version, publishedAt, yanked]
          properties:
            package: {type: string, minLength: 1}
            version: {type: string, minLength: 1}
            publishedAt: {type: string, format: date-time}
            yanked: {type: boolean}
            yankedAt: {type: string, format: date-time}
    preconditions:
      - expr: input.name in state.entities.package
        code: NOT_FOUND
        message: package does not exist
      - expr: "!((input.name + '#' + input.version) in state.entities.release)"
        code: CONFLICT
        message: release already exists
    effects:
      - op: insert
        entity: release
        key: input.name + '#' + input.version
        value: "{'package': input.name, 'version': input.version, 'publishedAt': clock, 'yanked': false}"
    query:
      entity: release
      key: input.name + '#' + input.version
      as: release
    postconditions:
      - expr: vars.release.yanked == false
        message: a new release must not be yanked
    result: "{'release': vars.release}"

  - name: yank_release
    description: Mark an existing release as yanked without deleting its history.
    inputSchema:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
    outputSchema:
      type: object
      additionalProperties: false
      required: [release]
      properties:
        release:
          type: object
          additionalProperties: false
          required: [package, version, publishedAt, yanked, yankedAt]
          properties:
            package: {type: string, minLength: 1}
            version: {type: string, minLength: 1}
            publishedAt: {type: string, format: date-time}
            yanked: {type: boolean}
            yankedAt: {type: string, format: date-time}
    preconditions:
      - expr: "(input.name + '#' + input.version) in state.entities.release"
        code: NOT_FOUND
        message: release does not exist
      - expr: "state.entities.release[input.name + '#' + input.version].yanked == false"
        code: CONFLICT
        message: release is already yanked
    effects:
      - op: update
        entity: release
        key: input.name + '#' + input.version
        merge: true
        value: "{'yanked': true, 'yankedAt': clock}"
    query:
      entity: release
      key: input.name + '#' + input.version
      as: release
    postconditions:
      - expr: vars.release.yanked == true
        message: yanked release must be marked yanked
    result: "{'release': vars.release}"

  - name: install_dependency
    description: Install a non-yanked release into an isolated project.
    inputSchema:
      type: object
      additionalProperties: false
      required: [project, name, version]
      properties:
        project: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
    outputSchema:
      type: object
      additionalProperties: false
      required: [installation]
      properties:
        installation:
          type: object
          additionalProperties: false
          required: [project, package, version, installedAt]
          properties:
            project: {type: string, minLength: 1}
            package: {type: string, minLength: 1}
            version: {type: string, minLength: 1}
            installedAt: {type: string, format: date-time}
    preconditions:
      - expr: "(input.name + '#' + input.version) in state.entities.release"
        code: NOT_FOUND
        message: release does not exist
      - expr: "state.entities.release[input.name + '#' + input.version].yanked == false"
        code: CONFLICT
        message: cannot install a yanked release
    effects:
      - op: insert
        entity: installation
        key: input.project + '#' + input.name
        value: "{'project': input.project, 'package': input.name, 'version': input.version, 'installedAt': clock}"
    query:
      entity: installation
      key: input.project + '#' + input.name
      as: installation
    result: "{'installation': vars.installation}"

  - name: check_advisories
    description: List simulated advisories matching a package and version.
    inputSchema:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
    outputSchema:
      type: object
      additionalProperties: false
      required: [advisories]
      properties:
        advisories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, package, affectedVersion, severity, summary]
            properties:
              id: {type: integer, minimum: 1}
              package: {type: string, minLength: 1}
              affectedVersion: {type: string, minLength: 1}
              severity: {type: string, enum: [low, medium, high, critical]}
              summary: {type: string, minLength: 1}
    query:
      entity: advisory
      many: true
      where: item.package == input.name && item.affectedVersion == input.version
      as: advisories
    result: "{'advisories': vars.advisories}"
