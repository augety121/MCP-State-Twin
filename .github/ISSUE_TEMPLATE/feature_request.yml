name: Feature request
description: Propose a bounded, testable capability or documentation change.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Who needs this, and what failure does it address?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed boundary
      description: Explain whether this belongs to the Twin, host adapter, agent, or upstream connector.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Describe positive, negative, determinism and resource-bound tests.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Scope checks
      options:
        - label: This does not require production passthrough in hermetic mode.
          required: true
        - label: This does not expose control-plane operations to agents.
          required: true
