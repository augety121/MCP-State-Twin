name: Bug report
description: Report a reproducible runtime, storage, MCP or documentation defect.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, private traces and production data. Security issues belong in the advisory channel.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.1 or full SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include synthetic TwinSpec/fixture/scenario or a link to a public fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact tokens and personal data.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Affected boundary
      options:
        - TwinSpec or Scenario admission
        - Deterministic runtime or state
        - Snapshot, fork or control plane
        - MCP data plane
        - CLI or documentation
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I used a synthetic, non-production reproduction.
          required: true
