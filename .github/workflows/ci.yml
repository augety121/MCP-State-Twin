name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Documentation authority and link integrity
        run: go test ./internal/doccheck -count=1
      - name: Scenario smoke
        run: go run ./cmd/statetwin scenario --spec examples/issue-tracker/twin.yaml --fixture examples/issue-tracker/state.json --scenario examples/issue-tracker/scenario-close-issue.yaml
      - name: Second reference domain smoke
        run: go run ./cmd/statetwin scenario --spec examples/package-registry/twin.yaml --fixture examples/package-registry/state.json --scenario examples/package-registry/scenario-release-lifecycle.yaml
      - name: TwinBundle and local Episode smoke
        run: |
          go run ./cmd/statetwin bundle build --manifest examples/issue-tracker/bundle.yaml --out "${RUNNER_TEMP}/issue-tracker.stb"
          go run ./cmd/statetwin bundle verify --bundle "${RUNNER_TEMP}/issue-tracker.stb"
          go run ./cmd/statetwin episode run --bundle "${RUNNER_TEMP}/issue-tracker.stb" --id ci-issue-tracker --out "${RUNNER_TEMP}/issue-tracker-evidence.json"
          go run ./cmd/statetwin episode run --bundle "${RUNNER_TEMP}/issue-tracker.stb" --id ci-durable --journal "${RUNNER_TEMP}/episodes.db"
          go run ./cmd/statetwin episode run --bundle "${RUNNER_TEMP}/issue-tracker.stb" --id ci-durable --journal "${RUNNER_TEMP}/episodes.db"
          go run ./cmd/statetwin episode inspect --journal "${RUNNER_TEMP}/episodes.db" --id ci-durable
          go run ./cmd/statetwin bundle build --manifest examples/package-registry/bundle.yaml --out "${RUNNER_TEMP}/package-registry.stb"
          go run ./cmd/statetwin episode run --bundle "${RUNNER_TEMP}/package-registry.stb" --id ci-package-registry --out "${RUNNER_TEMP}/package-registry-evidence.json"
      - name: Resource profile smoke
        run: |
          go run ./cmd/statetwin limits
          go run ./cmd/statetwin execution-profile
          go run ./cmd/statetwin --execution-mode balanced --max-procs 2 --memory-limit-mib 768 --max-inflight 6 execution-profile
      - name: MCP 2026 wire smoke
        run: |
          go test ./internal/server -run 'TestProtocolEvidencePinsSDKAndProfiles|TestMCP20260728|TestMCP20251125LegacyInitializeCompatibility' -count=1
          go run ./cmd/statetwin protocols
      - name: Build
        run: go build ./cmd/statetwin

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test and build
        run: |
          go test ./...
          go build ./cmd/statetwin

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: TwinSpec parser fuzz
        timeout-minutes: 5
        run: bash scripts/run-bounded-fuzz.sh spec
      - name: CEL compiler fuzz
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash scripts/run-bounded-fuzz.sh engine
      - name: Preserve synthetic fuzz counterexamples
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-counterexamples-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            internal/spec/testdata/fuzz/
            internal/engine/testdata/fuzz/
          if-no-files-found: warn
          retention-days: 14

  secret-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Gitleaks repository and history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Synthetic-fixture policy
        run: bash scripts/check-sensitive-fixtures.sh

  hermetic-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Warm module and build caches
        run: |
          go mod download
          go build -o ./statetwin ./cmd/statetwin
      - name: Test with only loopback networking
        run: sudo unshare --net env HOME="$HOME" PATH="$PATH" GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" bash scripts/run-hermetic-tests.sh ./statetwin

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Build conformance server
        run: go build -o ./statetwin ./cmd/statetwin
      - name: MCP tools-first conformance
        run: bash scripts/run-conformance.sh ./statetwin
