name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Validate reviewed release declaration
        id: plan
        env:
          GOMAXPROCS: "1"
        run: go run -p 1 ./cmd/releasecheck --tag "${GITHUB_REF_NAME}" --format github >> "${GITHUB_OUTPUT}"
      - name: Require exact tag and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

  gates:
    needs: admit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  stage:
    needs: [admit, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Refuse a moved or missing remote tag
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}" --no-tags
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "${GITHUB_SHA}"
      - name: Build release artifacts without overwriting
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Create reviewed draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.admit.outputs.prerelease }}
          RELEASE_NOTES: ${{ needs.admit.outputs.notes }}
        run: |
          flags=(--verify-tag --draft --latest=false --notes-file "${RELEASE_NOTES}" --title "MCP State Twin ${GITHUB_REF_NAME}")
          case "${RELEASE_PRERELEASE}" in
            true) flags+=(--prerelease) ;;
            false) ;;
            *) exit 2 ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}"
